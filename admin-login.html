<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECHMITRA — Admin Portal Login</title>
  
  <!-- Google Fonts: Manrope & DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       RESET & THEME VARIABLES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --primary-red: #e50916;
      --primary-red-hover: #c40813;
      --primary-gradient: linear-gradient(135deg, #e50916 0%, #b80712 100%);
      --red-glow: rgba(229, 9, 22, 0.28);
      --red-subtle-bg: #fef2f2;
      --red-border-subtle: #fee2e2;

      --text-main: #111827;
      --text-sub: #374151;
      --text-muted: #6b7280;
      --text-light: #9ca3af;

      --input-bg: #f8fafc;
      --input-border: #e2e8f0;
      --input-focus: #e50916;

      --font-heading: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 24px;
      --radius-pill: 9999px;

      --shadow-soft: 0 20px 45px rgba(15, 23, 42, 0.07), 0 4px 16px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 24px 50px rgba(229, 9, 22, 0.12), 0 6px 18px rgba(0, 0, 0, 0.04);
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -150px;
      right: -120px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(229, 9, 22, 0.14) 0%, rgba(229, 9, 22, 0.03) 55%, transparent 75%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -160px;
      left: -120px;
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(229, 9, 22, 0.1) 0%, rgba(229, 9, 22, 0.02) 60%, transparent 80%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .admin-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .admin-card {
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 38px 36px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(229, 231, 235, 0.9);
      position: relative;
      transition: var(--transition-smooth);
    }

    .admin-card:hover {
      box-shadow: var(--shadow-hover);
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--red-subtle-bg);
      border: 1px solid var(--red-border-subtle);
      border-radius: var(--radius-pill);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary-red);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 20px;
    }

    .security-badge svg {
      width: 13px;
      height: 13px;
    }

    .admin-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      text-decoration: none;
    }

    .brand-logo-wrap img {
      height: 52px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .admin-title {
      font-family: var(--font-heading);
      font-size: 25px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .admin-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.45;
    }

    .auth-alert-message {
      padding: 11px 15px;
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 18px;
      display: none;
      line-height: 1.45;
      text-align: left;
    }

    .auth-alert-message.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .auth-alert-message.success {
      display: block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      text-align: left;
    }

    .form-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-shell {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: var(--text-light);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
      transition: var(--transition-smooth);
    }

    .pill-input {
      width: 100%;
      height: 48px;
      padding: 10px 44px 10px 44px;
      font-size: 13.5px;
      font-family: var(--font-body);
      color: var(--text-main);
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-pill);
      outline: none;
      transition: var(--transition-smooth);
    }

    .pill-input::placeholder {
      color: var(--text-light);
      font-size: 13px;
    }

    .pill-input:focus {
      background: #ffffff;
      border-color: var(--primary-red);
      box-shadow: 0 0 0 3px rgba(229, 9, 22, 0.12);
    }

    .eye-toggle-btn {
      position: absolute;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      transition: var(--transition-smooth);
      z-index: 2;
    }

    .eye-toggle-btn:hover {
      color: var(--text-sub);
    }

    .error-hint {
      font-size: 11.5px;
      color: #dc2626;
      margin-left: 14px;
      margin-top: 3px;
      display: none;
      font-weight: 500;
    }

    .form-group.has-error .pill-input {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .form-group.has-error .error-hint {
      display: block;
    }

    .form-aux-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
      font-size: 12.5px;
    }

    .custom-checkbox-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text-sub);
      font-weight: 500;
      user-select: none;
    }

    .custom-checkbox-wrap input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .checkbox-box {
      width: 17px;
      height: 17px;
      background-color: #ffffff;
      border: 1.5px solid #d1d5db;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .custom-checkbox-wrap input:checked ~ .checkbox-box {
      background-color: var(--primary-red);
      border-color: var(--primary-red);
    }

    .checkbox-box::after {
      content: "";
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0);
      margin-bottom: 2px;
      transition: transform 0.15s ease-in-out;
    }

    .custom-checkbox-wrap input:checked ~ .checkbox-box::after {
      transform: rotate(45deg) scale(1);
    }

    .forgot-link {
      color: var(--primary-red);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition-smooth);
    }

    .forgot-link:hover {
      color: var(--primary-red-hover);
      text-decoration: underline;
    }

    .btn-admin-submit {
      width: 100%;
      height: 48px;
      border-radius: var(--radius-pill);
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      font-size: 14.5px;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 8px;
      box-shadow: 0 8px 22px var(--red-glow);
      transition: var(--transition-smooth);
    }

    .btn-admin-submit:hover {
      box-shadow: 0 10px 28px rgba(229, 9, 22, 0.42);
      transform: translateY(-1.5px);
    }

    .btn-admin-submit:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    .admin-footer {
      margin-top: 24px;
      text-align: center;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition-smooth);
    }

    .back-home-link:hover {
      color: var(--primary-red);
      transform: translateX(-3px);
    }

    .copyright-text {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-light);
      text-align: center;
    }

    @media (max-width: 480px) {
      .admin-card {
        padding: 30px 22px;
        border-radius: 20px;
      }
      .admin-title {
        font-size: 22px;
      }
      .brand-logo-wrap img {
        height: 46px;
      }
    }
  </style>
</head>
<body>

  <!-- Main Container -->
  <main class="admin-wrapper">

    <!-- Admin Login Card -->
    <section class="admin-card" aria-label="Administrator Authentication">

      <!-- Header & Branding -->
      <div class="admin-header">
        <a href="index.html" class="brand-logo-wrap" title="TECHMITRA Home">
          <img src="logo.png" alt="TECHMITRA Logo" onerror="this.style.display='none'">
        </a>

        <div class="security-badge" aria-label="Restricted System">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Official Admin Access</span>
        </div>

        <h1 class="admin-title">Admin Login</h1>
        <p class="admin-subtitle">Sign in to manage your learning platform.</p>
      </div>

      <!-- Feedback Alert Banner -->
      <div id="authAlert" class="auth-alert-message" role="alert" aria-live="assertive"></div>

      <!-- Administrator Login Form -->
      <form id="adminLoginForm" class="admin-form" novalidate>

        <!-- Email Address -->
        <div class="form-group" id="groupEmail">
          <label for="adminEmail" class="form-label">Admin Email Address</label>
          <div class="input-shell">
            <span class="input-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input
              type="email"
              id="adminEmail"
              name="email"
              class="pill-input"
              placeholder="adminuday@gmail.com"
              autocomplete="email"
              required
            >
          </div>
          <span class="error-hint" id="emailErrorHint">Please enter a valid administrator email.</span>
        </div>

        <!-- Password -->
        <div class="form-group" id="groupPassword">
          <label for="adminPassword" class="form-label">Password</label>
          <div class="input-shell">
            <span class="input-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input
              type="password"
              id="adminPassword"
              name="password"
              class="pill-input"
              placeholder="Enter your admin password"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="eye-toggle-btn"
              id="togglePasswordBtn"
              aria-label="Show password"
              title="Show/Hide Password"
            >
              <svg id="eyeSvg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="error-hint" id="passwordErrorHint">Please enter your password.</span>
        </div>

        <!-- Aux Options -->
        <div class="form-aux-row">
          <label class="custom-checkbox-wrap">
            <input type="checkbox" id="rememberAdmin" checked>
            <span class="checkbox-box" aria-hidden="true"></span>
            <span>Remember Me</span>
          </label>
          <span style="font-size: 11px; color: var(--primary-red); font-weight: 600;">Authorized Only</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-admin-submit" id="adminSubmitBtn">
          <span>Sign In to Admin Portal</span>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

      </form>

      <!-- Back to Main Website -->
      <footer class="admin-footer">
        <a href="index.html" class="back-home-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back to Main Website</span>
        </a>
      </footer>

    </section>

    <p class="copyright-text">&copy; 2026 TECHMITRA. All rights reserved. Authorized administrative access only.</p>

  </main>

  <!-- ==========================================================================
       FIREBASE AUTHENTICATION & STRICT ADMIN VERIFICATION
       ========================================================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      signOut,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 🔒 OFFICIAL ADMIN CREDENTIALS SPECIFIED BY YOU
    const OFFICIAL_ADMIN_EMAIL = "adminuday@gmail.com";
    const OFFICIAL_ADMIN_PASS = "Uday@7415";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAaELTyJ7Z_Ku53tBldsMYOGscPSe-OrHg",
      authDomain: "techmitra-web.firebaseapp.com",
      projectId: "techmitra-web",
      storageBucket: "techmitra-web.firebasestorage.app",
      messagingSenderId: "214838320813",
      appId: "1:214838320813:web:efef413add99454416f024",
      measurementId: "G-TDDT23B9XN"
    };

    let app, auth;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
    } catch (e) {
      console.warn("Firebase Init Notice:", e);
    }

    const adminLoginForm = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('adminEmail');
    const passwordInput = document.getElementById('adminPassword');
    const groupEmail = document.getElementById('groupEmail');
    const groupPassword = document.getElementById('groupPassword');
    const rememberCheckbox = document.getElementById('rememberAdmin');
    const adminSubmitBtn = document.getElementById('adminSubmitBtn');
    const authAlert = document.getElementById('authAlert');

    function showAlert(message, type = 'error') {
      authAlert.className = `auth-alert-message ${type}`;
      authAlert.textContent = message;
      authAlert.style.display = 'block';
    }

    function hideAlert() {
      authAlert.className = 'auth-alert-message';
      authAlert.style.display = 'none';
      authAlert.textContent = '';
    }

    // FORM SUBMISSION (STRICT ADMIN LOGIN)
    adminLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const enteredEmail = emailInput.value.trim().toLowerCase();
      const enteredPassword = passwordInput.value;

      if (!enteredEmail) {
        groupEmail.classList.add('has-error');
        return;
      }
      groupEmail.classList.remove('has-error');

      if (!enteredPassword) {
        groupPassword.classList.add('has-error');
        return;
      }
      groupPassword.classList.remove('has-error');

      // 🛡️ STEP 1: HARD BLOCK FOR ANY NON-ADMIN / STUDENT EMAIL
      if (enteredEmail !== OFFICIAL_ADMIN_EMAIL.toLowerCase()) {
        showAlert("⛔ Access Denied! Yeh ek Student account hai. Sirf official Admin (adminuday@gmail.com) hi yahan login kar sakte hain.", "error");
        return;
      }

      // 🛡️ STEP 2: VERIFY OFFICIAL ADMIN PASSWORD
      if (enteredPassword !== OFFICIAL_ADMIN_PASS) {
        showAlert("Galat Password! Admin password sahi enter karein.", "error");
        return;
      }

      try {
        adminSubmitBtn.disabled = true;
        adminSubmitBtn.textContent = "Verifying Admin Security...";

        // Set persistence
        try {
          const persistenceType = (rememberCheckbox && rememberCheckbox.checked) ? browserLocalPersistence : browserSessionPersistence;
          await setPersistence(auth, persistenceType);
        } catch (pErr) {}

        // Firebase login (or auto-create if not created in Firebase yet)
        let credential;
        try {
          credential = await signInWithEmailAndPassword(auth, enteredEmail, enteredPassword);
        } catch (authErr) {
          // Agar account abhi tak Firebase Auth me create nahi hua hai, to auto-create kar dega
          if (authErr.code === 'auth/user-not-found' || authErr.code === 'auth/invalid-credential') {
            try {
              credential = await createUserWithEmailAndPassword(auth, enteredEmail, enteredPassword);
            } catch (createErr) {
              throw authErr;
            }
          } else {
            throw authErr;
          }
        }

        const user = credential.user;

        // Set safe Admin Session Keys
        sessionStorage.setItem("techmitra_admin_auth", "true");
        sessionStorage.setItem("techmitra_admin_email", OFFICIAL_ADMIN_EMAIL);
        sessionStorage.setItem("techmitra_admin_uid", user.uid);

        showAlert("Admin Access Verified! Opening Dashboard...", "success");

        // Redirect to admin dashboard
        setTimeout(() => {
          window.location.replace("admin-dashboard.html");
        }, 500);

      } catch (error) {
        console.error("Admin Login Error:", error);
        adminSubmitBtn.disabled = false;
        adminSubmitBtn.textContent = "Sign In to Admin Portal";
        showAlert("Firebase error: " + (error.message || "Login failed. Please check internet connection."));
      }
    });

    emailInput.addEventListener('input', () => groupEmail.classList.remove('has-error'));
    passwordInput.addEventListener('input', () => groupPassword.classList.remove('has-error'));
  </script>

  <!-- Show / Hide Password Toggle -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const passwordInput = document.getElementById('adminPassword');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const eyeSvg = document.getElementById('eyeSvg');

      if (togglePasswordBtn && passwordInput && eyeSvg) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');

          if (isPassword) {
            eyeSvg.innerHTML = `
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            `;
          } else {
            eyeSvg.innerHTML = `
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            `;
          }
        });
      }
    });
  </script>
</body>
</html>
